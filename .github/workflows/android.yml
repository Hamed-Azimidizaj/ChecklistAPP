name: Build and Upload Android APK on Release

on:
  release:
    types: [created]  # Triggers only when a new release is created

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install
          npx expo install
          npm install -g eas-cli

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Prebuild Expo project
        run: npx expo prebuild

      - name: Build APK
        run: npx eas build --platform android --profile production --non-interactive

      - name: Upload APK as a release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/**/*.apk
          asset_name: app.apk
          asset_content_type: application/vnd.android.package-archive
