name: Build Android APK

on:
  push:
    branches:
      - main  # Runs on every push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest  # Use the free Linux-based runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Check out the code from the repository

      - name: Set up Node.js
        uses: actions/setup-node@v3  # Set up Node.js
        with:
          node-version: '18'  # Use Node.js version 18

      - name: Install dependencies
        run: |
          npm install  # Install project dependencies
          npx expo install  # Ensure Expo dependencies are installed

      - name: Prebuild Expo project
        run: |
          npx expo prebuild  # Prebuild the Expo project to make sure everything is ready

      - name: Build APK
        run: |
          npx eas build --platform android --profile production --non-interactive  # Build the APK

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v2  # Upload the generated APK as an artifact
        with:
          name: android-apk  # The name of the artifact
          path: build/**/*.apk  # Path to the APK file
