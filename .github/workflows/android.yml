name: Build Android APK

on:
  push:
    branches:
      - main  # Trigger on push to main branch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Checkout the code from the repository

      - name: Set up Node.js
        uses: actions/setup-node@v3  # Set up Node.js environment
        with:
          node-version: '18'  # Use Node.js version 18

      - name: Install dependencies
        run: |
          npm install  # Install project dependencies
          npm install -g eas-cli  # Install EAS CLI globally

      - name: Force initialize EAS project
        run: |
          echo "Forcing EAS init..."
          eas init --non-interactive --force


      - name: Clear npm cache
        run: npm cache clean --force  # Clear npm cache to avoid potential issues

      - name: Build APK
        run: |
          echo "Building APK...";
          npx eas build --platform android --profile production --non-interactive  # Build the APK
